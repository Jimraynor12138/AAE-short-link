# 开发环境配置
# 注意：数据库凭据为本地开发占位，生产/开源时请使用 application-local.yml（已被 .gitignore 排除）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/short_link?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      # 连接池较小起步，压测版本再按需调优
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
  # Redis（本地安装，无密码）
  data:
    redis:
      host: localhost
      port: 6379
      # 本地无密码，password 省略
      timeout: 2s
      connect-timeout: 2s
  # RabbitMQ（本地安装，guest 仅允许从 localhost 连接）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 并发消费者数：生产端（跳转）往往远快于单消费者，靠并发/多实例扩容拉平速度
        concurrency: 2
        max-concurrency: 8
        prefetch: 50
        # 重试用尽后不重新入队 → 消息进入死信队列（避免无限重试打爆日志）
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
